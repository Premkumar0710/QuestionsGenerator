name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - develop
      - feature-branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code from the repository
      - name: 🔁 Checkout code
        uses: actions/checkout@v3

      # Validate commit message format (based on conventional commits)
      - name: 🔍 Validate commit message
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Last commit message: $COMMIT_MSG"
          if [[ ! "$COMMIT_MSG" =~ ^(feat|fix|docs|style|refactor|test|chore)\: ]]; then
            echo "❌ Invalid commit message prefix."
            echo "✅ Use format like: feat: add login functionality"
            exit 1
          fi
          
          DESCRIPTION=$(echo "$COMMIT_MSG" | cut -d':' -f2- | xargs)
          if [[ -z "$DESCRIPTION" ]]; then
            echo "❌ Missing commit description after prefix."
            echo "✅ Use format like: feat: add login functionality"
            exit 1
          fi
          
          echo "✅ Commit message is valid."

      # Set up Java 17
      - name: ☕ Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Build the project using Maven
      - name: 🧪 Build with Maven
        run: mvn clean install -DskipTests

      # Log in to Docker Hub
      - name: 🐳 Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Build the Docker image
      - name: 📦 Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/questions-generator:latest .

      # Push the Docker image to Docker Hub
      - name: 🚀 Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/questions-generator:latest

      # Deploy the Docker image on EC2 instance
      - name: 🛠️ Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Stop and remove any running container with the same name
            docker rm -f questions-generator || true
            # Pull the latest Docker image from Docker Hub
            docker pull ${{ secrets.DOCKER_USERNAME }}/questions-generator:latest
            # Run the new container
            docker run -d --name questions-generator -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/questions-generator:latest

      # Clean up local Docker images after the deployment
      - name: 🧹 Clean up local Docker
        run: |
          docker rmi ${{ secrets.DOCKER_USERNAME }}/questions-generator:latest || true
